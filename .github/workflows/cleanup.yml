name: "History and Log Cleanup Engine"

on:
  push:
    # Safe structure: looks at the main branch, but targets workflow changes
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
      
jobs:
  clean-history:
    runs-on: ubuntu-latest
    permissions:
      actions: write 
    steps:
      - name: Delete old runs
        uses: JuvenileQ/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1 # Guarantees your UI buttons never vanish
