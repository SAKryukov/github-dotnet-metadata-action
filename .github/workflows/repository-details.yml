name: Synchronize Repository Details
run-name: "Synchronize Repository Details #${{ github.run_number }} [Trigger: ${{ github.event_name }}]"

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/repository-details.yml'
  workflow_dispatch:

jobs:
  sync-details:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4.2.2

      - name: Push Repository Details Natively
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Updating live repository details from text definitions..."
          
          # Sets About text description and external homepage URL links
          gh repo edit ${{ github.repository }} \
            --description "Metadata-driven .NET build action: Single MSBuild file provides metadata for a .NET solution." \
            --homepage "https://www.sakryukov.org"
            
          # Registers clean search topics explicitly
          gh repo edit ${{ github.repository }} \
            --add-topic "actions" \
            --add-topic "dotnet" \
            --add-topic "ci-cd"
