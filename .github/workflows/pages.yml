name: "Pages build and deployment"
run-name: "Pages Deploy #${{ github.run_number }} [Trigger: ${{ github.event_name }}]"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'deploy/**'
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare metadata 
        working-directory: ./.github/workflows
        run: |
          dotnet build metadata.targets --target:Metadata       

      - name: Setup Pages
        uses: actions/configure-pages@v5    

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SourceForPages }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
